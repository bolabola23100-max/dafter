name: Flutter Analyze

on:
  push:
    branches: [gpt]
  pull_request:
    branches: [gpt]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
